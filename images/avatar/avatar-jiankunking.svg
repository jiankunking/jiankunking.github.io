<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- Background -->
  <rect width="512" height="512" fill="#F6EEE3"/>
  <circle cx="256" cy="238" r="180" fill="#EFE3D1"/>

  <!-- Neck -->
  <path d="M224,314 h64 v86 h-64 z" fill="#DCA575"/>
  <!-- Chin shadow: subtle, within neck -->
  <ellipse cx="256" cy="356" rx="26" ry="9" fill="#C98F60" opacity="0.45"/>

  <!-- Shoulders / black polo -->
  <path d="M58,512 C60,434 126,392 196,376 L316,376 C386,392 452,434 454,512 Z" fill="#212225"/>
  <!-- Polo collar -->
  <path d="M224,376 L256,416 L198,398 Z" fill="#2E2F33"/>
  <path d="M288,376 L256,416 L314,398 Z" fill="#2E2F33"/>
  <path d="M224,376 L256,416 L198,398 Z" fill="none" stroke="#17181A" stroke-width="1.5"/>
  <path d="M288,376 L256,416 L314,398 Z" fill="none" stroke="#17181A" stroke-width="1.5"/>
  <!-- Placket -->
  <path d="M248,412 h16 v74 h-16 z" fill="#1A1B1E"/>
  <circle cx="256" cy="434" r="3.5" fill="#4A4B50"/>
  <circle cx="256" cy="460" r="3.5" fill="#4A4B50"/>

  <!-- Ears -->
  <ellipse cx="166" cy="242" rx="15" ry="25" fill="#E4AE7E"/>
  <ellipse cx="346" cy="242" rx="15" ry="25" fill="#E4AE7E"/>
  <path d="M164,234 C158,240 160,250 168,254" stroke="#CE9464" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M348,234 C354,240 352,250 344,254" stroke="#CE9464" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Face: full cheeks, soft wide jaw -->
  <path d="M256,102 C324,102 344,152 344,202
           C346,256 336,310 306,334
           C292,344 276,348 256,348
           C236,348 220,344 206,334
           C176,310 166,256 168,202
           C168,152 188,102 256,102 Z" fill="#EDB88E"/>
  <!-- Face side shading -->
  <path d="M344,202 C346,256 336,310 306,334 C292,344 276,348 256,348
           C286,334 310,302 320,254 C328,214 330,198 328,170 Z" fill="#E0A97C" opacity="0.45"/>

  <!-- Hair: short buzz cut -->
  <path d="M167,208 C162,140 198,98 256,98 C314,98 350,140 345,208
           C338,178 325,164 308,157 C292,151 273,166 256,166
           C239,166 220,151 204,157 C187,164 174,178 167,208 Z" fill="#1C1B1D"/>
  <!-- Sideburns: slim, flush with hair edge -->
  <path d="M168,206 C167,220 168,234 172,246 C176,248 179,244 179,239
           C176,227 175,216 176,205 Z" fill="#1C1B1D"/>
  <path d="M344,206 C345,220 344,234 340,246 C336,248 333,244 333,239
           C336,227 337,216 336,205 Z" fill="#1C1B1D"/>

  <!-- Eyebrows: raised, clear of the frame -->
  <path d="M211,191 C222,184 240,183 251,189" stroke="#1C1B1D" stroke-width="6.5" fill="none" stroke-linecap="round"/>
  <path d="M261,189 C272,183 290,184 301,191" stroke="#1C1B1D" stroke-width="6.5" fill="none" stroke-linecap="round"/>

  <!-- Glasses: browline style -->
  <rect x="193" y="212" width="61" height="50" rx="13" fill="#DDEAF0" opacity="0.35"/>
  <rect x="258" y="212" width="61" height="50" rx="13" fill="#DDEAF0" opacity="0.35"/>
  <!-- lower thin gold rims -->
  <path d="M194,228 C194,252 204,262 224,262 C244,262 254,252 254,230" stroke="#C9A24B" stroke-width="2.5" fill="none"/>
  <path d="M258,230 C258,252 268,262 288,262 C308,262 318,252 318,228" stroke="#C9A24B" stroke-width="2.5" fill="none"/>
  <!-- top thick black bars -->
  <path d="M190,214 L255,214" stroke="#141416" stroke-width="9" stroke-linecap="round"/>
  <path d="M257,214 L322,214" stroke="#141416" stroke-width="9" stroke-linecap="round"/>
  <!-- bridge -->
  <path d="M251,216 L261,216" stroke="#141416" stroke-width="7" stroke-linecap="round"/>
  <!-- temples to ears -->
  <path d="M191,218 L170,228" stroke="#141416" stroke-width="5" stroke-linecap="round"/>
  <path d="M321,218 L342,228" stroke="#141416" stroke-width="5" stroke-linecap="round"/>

  <!-- Eyes -->
  <path d="M212,234 C217,226 233,226 238,234 C233,242 217,242 212,234 Z" fill="#2A2119"/>
  <circle cx="229" cy="231" r="2.5" fill="#FFFFFF" opacity="0.9"/>
  <path d="M274,234 C279,226 295,226 300,234 C295,242 279,242 274,234 Z" fill="#2A2119"/>
  <circle cx="291" cy="231" r="2.5" fill="#FFFFFF" opacity="0.9"/>

  <!-- Nose -->
  <path d="M252,254 C249,269 245,276 253,279 C259,280 264,278 267,274" stroke="#CE9464" stroke-width="4" fill="none" stroke-linecap="round"/>

  <!-- Mouth: gentle closed smile -->
  <path d="M230,299 C243,310 269,310 282,299" stroke="#B4664E" stroke-width="5" fill="none" stroke-linecap="round"/>

  <!-- Cheek blush -->
  <ellipse cx="202" cy="278" rx="17" ry="11" fill="#E58A66" opacity="0.16"/>
  <ellipse cx="310" cy="278" rx="17" ry="11" fill="#E58A66" opacity="0.16"/>

  <!-- Sailboat emblem (his left chest / viewer right) -->
  <g fill="#F4F1EA">
    <path d="M347,406 L347,446 L377,446 Z"/>
    <path d="M341,414 L341,446 L324,446 Z"/>
    <path d="M320,451 L382,451 C377,461 370,464 361,464 L341,464 C332,464 325,460 320,451 Z"/>
  </g>
</svg>
