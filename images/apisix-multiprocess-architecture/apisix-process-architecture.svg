<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 600" role="img" aria-labelledby="apisix-process-architecture-title apisix-process-architecture-desc" id="apisix-process-architecture-root">
<title id="apisix-process-architecture-title">APISIX 进程与状态分布</title>
<desc id="apisix-process-architecture-desc">示例请求由客户端经过 worker 1 到达上游，master 只管理进程，各 worker 保有本地状态，并可访问具有各自共享区和锁的不同字典。</desc>
<defs>
      <style>#apisix-process-architecture-root { color: #2d2d2d; font-family: Lato,"Noto Sans SC","PingFang SC",sans-serif; }
      #apisix-process-architecture-root .diagram-container { width:100%; overflow-x:auto; }
      #apisix-process-architecture-root text { font-family:Lato,"Noto Sans SC","PingFang SC",sans-serif; fill:#2d2d2d; }
      #apisix-process-architecture-root .name { font-size:18px; font-weight:700; }
      #apisix-process-architecture-root .detail { font-size:15px; fill:#686868; }
      #apisix-process-architecture-root .small { font-size:14px; fill:#686868; }
      #apisix-process-architecture-root .tech { font-family:consolas,Menlo,"PingFang SC",monospace; font-size:16px; }
      @media print {
#apisix-process-architecture-root .diagram-container { overflow-x:visible; }
}</style>
<marker id="apisix-process-architecture-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#686868"/></marker>
<marker id="apisix-process-architecture-traffic-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 L10 5 L0 10z" fill="#404040"/></marker>
</defs>
