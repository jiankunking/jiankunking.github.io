<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">AI正在抽走成长阶梯的前几级</title>
  <desc id="desc">已经形成判断力的人借助AI继续向上，刚起步的人却可能因基础工作被AI接管而失去成长台阶。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#574b3d" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="warm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D7643C"/>
      <stop offset="1" stop-color="#B94326"/>
    </linearGradient>
    <style>
      .cn { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .title { font-size: 54px; font-weight: 700; fill: #302D29; letter-spacing: 1px; }
      .subtitle { font-size: 24px; fill: #7E766C; }
      .label { font-size: 28px; font-weight: 600; fill: #3F3A34; }
      .small { font-size: 22px; fill: #81796F; }
      .accent { fill: #C74C2C; }
      .accentText { font-size: 26px; font-weight: 650; fill: #B94326; }
      .white { fill: #FFFDF8; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1600" height="960" fill="#F7F2E9"/>
  <circle cx="136" cy="132" r="72" fill="#EBDCC7" opacity="0.55"/>
  <circle cx="1480" cy="822" r="110" fill="#EBDCC7" opacity="0.42"/>

  <!-- heading -->
  <text x="800" y="92" text-anchor="middle" class="cn title">AI 正在抽走成长阶梯的前几级</text>
  <text x="800" y="138" text-anchor="middle" class="cn subtitle">效率提高了，但判断力不会凭空长出来</text>

  <!-- main card -->
  <rect x="115" y="185" width="1370" height="670" rx="32" fill="#FFFDF8" filter="url(#shadow)"/>

  <!-- ladder rails -->
  <line x1="690" y1="245" x2="690" y2="785" stroke="#5C564D" stroke-width="14" stroke-linecap="round"/>
  <line x1="910" y1="245" x2="910" y2="785" stroke="#5C564D" stroke-width="14" stroke-linecap="round"/>

  <!-- solid upper rungs -->
  <line x1="690" y1="350" x2="910" y2="350" stroke="url(#warm)" stroke-width="18" stroke-linecap="round"/>
  <line x1="690" y1="455" x2="910" y2="455" stroke="url(#warm)" stroke-width="18" stroke-linecap="round"/>
  <line x1="690" y1="560" x2="910" y2="560" stroke="url(#warm)" stroke-width="18" stroke-linecap="round"/>

  <!-- missing rung guides -->
  <line x1="690" y1="660" x2="910" y2="660" stroke="#C9C2B7" stroke-width="10" stroke-linecap="round" stroke-dasharray="7 24"/>
  <line x1="690" y1="750" x2="910" y2="750" stroke="#C9C2B7" stroke-width="10" stroke-linecap="round" stroke-dasharray="7 24"/>

  <!-- experienced person at top -->
  <circle cx="800" cy="236" r="34" fill="#302D29"/>
  <rect x="769" y="274" width="62" height="72" rx="29" fill="#302D29"/>

  <!-- upper left label -->
  <rect x="185" y="270" width="355" height="146" rx="22" fill="#F3E7D7"/>
  <text x="225" y="320" class="cn label">已经爬上去的人</text>
  <text x="225" y="365" class="cn accentText">判断力 × AI</text>
  <text x="225" y="397" class="cn small">经验被放大，效率继续提升</text>
  <path d="M540 344 C595 330, 622 304, 675 294" fill="none" stroke="#B8AA98" stroke-width="5" stroke-linecap="round"/>
  <path d="M658 284 L678 293 L663 309" fill="none" stroke="#B8AA98" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- judgment label -->
  <rect x="1015" y="338" width="360" height="190" rx="22" fill="#FAEDE7"/>
  <text x="1055" y="394" class="cn accentText">判断力</text>
  <text x="1055" y="438" class="cn label">能验证 · 能取舍 · 能负责</text>
  <line x1="1055" y1="470" x2="1328" y2="470" stroke="#E5C2B4" stroke-width="3"/>
  <text x="1055" y="505" class="cn small">它来自长期实践，不是工具赠品</text>
  <path d="M1015 438 L937 438" fill="none" stroke="#C74C2C" stroke-width="5" stroke-linecap="round"/>
  <path d="M957 426 L937 438 L957 450" fill="none" stroke="#C74C2C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- newcomer -->
  <circle cx="492" cy="692" r="30" fill="#AAA397"/>
  <rect x="465" y="727" width="54" height="65" rx="26" fill="#AAA397"/>
  <line x1="519" y1="746" x2="654" y2="691" stroke="#AAA397" stroke-width="13" stroke-linecap="round"/>
  <text x="245" y="724" class="cn label">刚起步的人</text>
  <text x="245" y="763" class="cn small">够不到第一块完整踏板</text>
  <text x="245" y="797" class="cn small">也少了试错和练习的机会</text>

  <!-- removed rungs on right -->
  <g transform="rotate(-8 1210 676)">
    <line x1="1080" y1="642" x2="1308" y2="642" stroke="url(#warm)" stroke-width="18" stroke-linecap="round"/>
    <line x1="1100" y1="728" x2="1328" y2="728" stroke="url(#warm)" stroke-width="18" stroke-linecap="round"/>
  </g>
  <path d="M942 680 C992 682, 1015 672, 1056 658" fill="none" stroke="#C74C2C" stroke-width="5" stroke-linecap="round"/>
  <path d="M1038 650 L1059 657 L1046 675" fill="none" stroke="#C74C2C" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1100" y="790" class="cn accentText">AI 接管基础工作</text>
  <text x="1100" y="825" class="cn small">被省掉的，也可能是成长过程</text>

  <!-- footer strip -->
  <rect x="360" y="874" width="880" height="58" rx="29" fill="#3D3933"/>
  <text x="800" y="913" text-anchor="middle" class="cn" font-size="25" font-weight="600" fill="#FFFDF8">别把所有过程都交出去，给自己留一点笨功夫</text>
</svg>
