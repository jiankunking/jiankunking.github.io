<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">技术浪潮不断更替，基本功决定你能走多远</title>
  <desc id="desc">框架生态、云原生、大模型与AI Agent等技术浪潮持续更替，前行的道路由计算机基础与工程基本功、实践经验和独立判断三项能力共同支撑。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#4B4038" flood-opacity="0.13"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-40%" width="160%" height="190%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#342E29" flood-opacity="0.15"/>
    </filter>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#514C46"/>
      <stop offset="1" stop-color="#302E2B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#DC704A"/>
      <stop offset="1" stop-color="#B84227"/>
    </linearGradient>
    <style>
      .cn { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .title { font-size: 58px; font-weight: 760; fill: #302D29; letter-spacing: 1px; }
      .subtitle { font-size: 25px; fill: #716A62; }
      .roadLabel { font-size: 20px; font-weight: 700; fill: #F2C3AE; letter-spacing: 1px; }
      .tool { font-size: 20px; font-weight: 650; fill: #514B45; }
      .toolCurrent { font-size: 20px; font-weight: 720; fill: #A9432A; }
      .pillarTitle { font-size: 30px; font-weight: 720; fill: #FFFDF8; }
      .pillarText { font-size: 20px; fill: #F8E9DE; }
      .supportLabel { font-size: 20px; font-weight: 650; fill: #8B7768; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1600" height="960" fill="#F7F2E9"/>
  <circle cx="118" cy="122" r="76" fill="#EAD8BF" opacity=".38"/>
  <circle cx="1480" cy="835" r="118" fill="#EAD8BF" opacity=".27"/>

  <!-- headline -->
  <text x="800" y="82" text-anchor="middle" class="cn title">技术浪潮不断更替，基本功决定你能走多远</text>
  <text x="800" y="130" text-anchor="middle" class="cn subtitle">计算机基础与工程基本功、实践经验和独立判断，决定你能否真正驾驭 AI</text>

  <!-- road: tools now live on the road instead of floating above it -->
  <g filter="url(#shadow)">
    <path d="M130 210 Q800 180 1470 210 L1420 480 H180 Z" fill="url(#road)"/>
  </g>

  <text x="190" y="258" class="cn roadLabel">热门技术持续迭代</text>
  <path d="M360 251 H1390" fill="none" stroke="#887E74" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 12"/>
  <path d="M1374 240 L1393 251 L1374 262" fill="none" stroke="#887E74" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- tool milestones embedded in the road -->
  <g class="cn">
    <g opacity=".78">
      <rect x="180" y="292" width="190" height="58" rx="29" fill="#EFE8DF"/>
      <text x="275" y="329" text-anchor="middle" class="tool">框架生态</text>
    </g>
    <path d="M386 321 H442" stroke="#B9AA9A" stroke-width="4" stroke-linecap="round"/>
    <path d="M428 311 L444 321 L428 331" fill="none" stroke="#B9AA9A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g opacity=".9">
      <rect x="460" y="292" width="190" height="58" rx="29" fill="#F5EEE6"/>
      <text x="555" y="329" text-anchor="middle" class="tool">云原生</text>
    </g>
    <path d="M666 321 H722" stroke="#B9AA9A" stroke-width="4" stroke-linecap="round"/>
    <path d="M708 311 L724 321 L708 331" fill="none" stroke="#B9AA9A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#softShadow)">
      <rect x="740" y="286" width="200" height="70" rx="35" fill="#FFFDF8" stroke="#E4CFC2" stroke-width="2"/>
      <circle cx="775" cy="321" r="10" fill="#C84B2D"/>
      <text x="848" y="329" text-anchor="middle" class="toolCurrent">大模型</text>
    </g>
    <path d="M956 321 H1012" stroke="#D26442" stroke-width="4" stroke-linecap="round"/>
    <path d="M998 311 L1014 321 L998 331" fill="none" stroke="#D26442" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#softShadow)">
      <rect x="1030" y="286" width="180" height="70" rx="35" fill="#FFF8F3" stroke="#E4CFC2" stroke-width="2"/>
      <text x="1120" y="329" text-anchor="middle" class="toolCurrent">AI Agent</text>
    </g>
    <path d="M1226 321 H1272" stroke="#B9AA9A" stroke-width="4" stroke-linecap="round"/>
    <path d="M1258 311 L1274 321 L1258 331" fill="none" stroke="#B9AA9A" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g opacity=".78">
      <rect x="1290" y="292" width="150" height="58" rx="29" fill="#EFE8DF" stroke="#CFC4B8" stroke-width="2" stroke-dasharray="6 6"/>
      <text x="1365" y="329" text-anchor="middle" class="tool">下一个浪潮</text>
    </g>
  </g>

  <!-- the lower lane makes “keep moving forward” explicit without another floating arrow -->
  <path d="M205 420 Q800 382 1395 420" fill="none" stroke="#E6D2B8" stroke-width="7" stroke-linecap="round" stroke-dasharray="28 31" opacity=".9"/>

  <!-- walking person on the road -->
  <g transform="translate(1165 345) scale(.70)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="27" fill="#272522"/>
    <path d="M-5 30 C-25 55 -21 96 -4 116 L19 94 C8 72 12 50 24 38 Z" fill="url(#accent)"/>
    <path d="M-6 53 L-49 78" fill="none" stroke="#272522" stroke-width="13" stroke-linecap="round"/>
    <path d="M17 56 L55 73" fill="none" stroke="#272522" stroke-width="13" stroke-linecap="round"/>
    <path d="M-2 110 L-35 159" fill="none" stroke="#272522" stroke-width="15" stroke-linecap="round"/>
    <path d="M14 108 L51 145" fill="none" stroke="#272522" stroke-width="15" stroke-linecap="round"/>
    <path d="M-36 159 L-60 159" fill="none" stroke="#272522" stroke-width="13" stroke-linecap="round"/>
    <path d="M50 145 L72 145" fill="none" stroke="#272522" stroke-width="13" stroke-linecap="round"/>
  </g>

  <!-- three equal, aligned supports -->
  <g filter="url(#shadow)">
    <rect x="180" y="478" width="400" height="362" rx="8" fill="#B95B3B"/>
    <rect x="600" y="478" width="400" height="362" rx="8" fill="#9D4933"/>
    <rect x="1020" y="478" width="400" height="362" rx="8" fill="#743F34"/>
  </g>
  <rect x="180" y="478" width="400" height="10" rx="5" fill="#D97A58"/>
  <rect x="600" y="478" width="400" height="10" rx="5" fill="#C16449"/>
  <rect x="1020" y="478" width="400" height="10" rx="5" fill="#96584A"/>

  <!-- support 1 -->
  <g transform="translate(332 525)">
    <path d="M0 0 H96 V80 H0 Z" fill="none" stroke="#FFF4EA" stroke-width="6" stroke-linejoin="round"/>
    <path d="M48 0 V80" stroke="#FFF4EA" stroke-width="5"/>
    <path d="M12 19 H35 M12 36 H35 M61 19 H84 M61 36 H84" stroke="#FFF4EA" stroke-width="4" stroke-linecap="round" opacity=".86"/>
  </g>
  <text x="380" y="650" text-anchor="middle" class="cn pillarTitle">
    <tspan x="380">计算机基础</tspan><tspan x="380" dy="40">与工程基本功</tspan>
  </text>
  <text x="380" y="755" text-anchor="middle" class="cn pillarText">网络 · 数据库 · 并发</text>
  <text x="380" y="792" text-anchor="middle" class="cn pillarText">编码 · 调试 · 测试</text>

  <!-- support 2 -->
  <g transform="translate(752 563)">
    <circle cx="48" cy="0" r="44" fill="none" stroke="#FFF4EA" stroke-width="6"/>
    <path d="M48 -29 V29 M19 0 H77 M28 -20 L68 20 M68 -20 L28 20" stroke="#FFF4EA" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    <circle cx="48" cy="0" r="12" fill="#FFF4EA"/>
  </g>
  <text x="800" y="670" text-anchor="middle" class="cn pillarTitle">实践经验</text>
  <text x="800" y="755" text-anchor="middle" class="cn pillarText">写过代码 · 排过故障</text>
  <text x="800" y="792" text-anchor="middle" class="cn pillarText">踩过坑 · 做过复盘</text>

  <!-- support 3 -->
  <g transform="translate(1172 513)">
    <path d="M48 0 L96 21 V56 C96 89 76 110 48 124 C20 110 0 89 0 56 V21 Z" fill="none" stroke="#FFF4EA" stroke-width="6" stroke-linejoin="round"/>
    <path d="M25 59 L42 76 L73 41" fill="none" stroke="#FFF4EA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1220" y="670" text-anchor="middle" class="cn pillarTitle">独立判断</text>
  <text x="1220" y="755" text-anchor="middle" class="cn pillarText">识别错误 · 权衡方案</text>
  <text x="1220" y="792" text-anchor="middle" class="cn pillarText">验证结果 · 承担责任</text>
</svg>
