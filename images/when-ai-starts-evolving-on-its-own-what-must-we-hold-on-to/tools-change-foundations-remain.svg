<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">工具会变，基本功不会过时</title>
  <desc id="desc">框架、搜索工具、大模型与AI Agent持续更替，而前行的道路始终由计算机基础与工程基本功、实践经验和独立判断三块基石支撑。</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="180%">
      <feDropShadow dx="0" dy="13" stdDeviation="18" flood-color="#57483C" flood-opacity="0.12"/>
    </filter>
    <filter id="softShadow" x="-30%" y="-40%" width="160%" height="190%">
      <feDropShadow dx="0" dy="7" stdDeviation="9" flood-color="#463B32" flood-opacity="0.10"/>
    </filter>
    <linearGradient id="road" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#514C46"/>
      <stop offset="1" stop-color="#36332F"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D96A43"/>
      <stop offset="1" stop-color="#B84227"/>
    </linearGradient>
    <style>
      .cn { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .title { font-size: 58px; font-weight: 760; fill: #302D29; letter-spacing: 1px; }
      .subtitle { font-size: 26px; fill: #716A62; }
      .toolLabel { font-size: 22px; font-weight: 700; fill: #B94A2C; }
      .tool { font-size: 22px; font-weight: 650; fill: #625C55; }
      .toolMuted { font-size: 20px; font-weight: 620; fill: #8B837A; }
      .foundation { font-size: 32px; font-weight: 720; fill: #FFFDF8; }
      .foundationSub { font-size: 25px; font-weight: 650; fill: #FFF5EC; }
      .foundationSmall { font-size: 20px; fill: #F8E9DE; }
    </style>
  </defs>

  <!-- background -->
  <rect width="1600" height="960" fill="#F7F2E9"/>
  <circle cx="120" cy="132" r="78" fill="#EAD8BF" opacity=".42"/>
  <circle cx="1480" cy="825" r="120" fill="#EAD8BF" opacity=".30"/>
  <path d="M72 246 C255 204 390 224 540 182" fill="none" stroke="#E5D5C0" stroke-width="3" stroke-dasharray="6 15"/>
  <path d="M1080 164 C1260 121 1390 150 1515 104" fill="none" stroke="#E5D5C0" stroke-width="3" stroke-dasharray="6 15"/>

  <!-- concise headline -->
  <text x="800" y="82" text-anchor="middle" class="cn title">工具会变，基本功不会过时</text>
  <text x="800" y="132" text-anchor="middle" class="cn subtitle">真正决定一个人能走多远的，是计算机基础与工程基本功、实践经验和独立判断</text>

  <!-- lightweight changing-tools band -->
  <g class="cn">
    <text x="170" y="202" class="toolLabel">工具持续更替</text>
    <line x1="350" y1="195" x2="1428" y2="195" stroke="#CDBFAF" stroke-width="4" stroke-linecap="round" stroke-dasharray="7 13"/>
    <path d="M1410 183 L1432 195 L1410 207" fill="none" stroke="#CDBFAF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g opacity=".70">
      <rect x="175" y="226" width="180" height="58" rx="29" fill="#EEE8E0"/>
      <text x="265" y="263" text-anchor="middle" class="toolMuted">热门框架</text>
    </g>
    <path d="M375 255 H426" stroke="#C7B9AA" stroke-width="4" stroke-linecap="round"/>
    <path d="M412 245 L428 255 L412 265" fill="none" stroke="#C7B9AA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g opacity=".82">
      <rect x="450" y="226" width="190" height="58" rx="29" fill="#EEE8E0"/>
      <text x="545" y="263" text-anchor="middle" class="tool">IDE 与搜索</text>
    </g>
    <path d="M660 255 H711" stroke="#C7B9AA" stroke-width="4" stroke-linecap="round"/>
    <path d="M697 245 L713 255 L697 265" fill="none" stroke="#C7B9AA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#softShadow)">
      <rect x="735" y="220" width="205" height="70" rx="35" fill="#FFFDF8" stroke="#E4CFC2" stroke-width="2"/>
      <circle cx="775" cy="255" r="12" fill="#C84B2D"/>
      <text x="845" y="263" text-anchor="middle" class="tool" fill="#B94326">大模型工具</text>
    </g>
    <path d="M960 255 H1011" stroke="#C75A38" stroke-width="4" stroke-linecap="round"/>
    <path d="M997 245 L1013 255 L997 265" fill="none" stroke="#C75A38" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g filter="url(#softShadow)">
      <rect x="1035" y="220" width="185" height="70" rx="35" fill="#FFF8F3" stroke="#E4CFC2" stroke-width="2"/>
      <text x="1127" y="263" text-anchor="middle" class="tool" fill="#A84E33">AI Agent</text>
    </g>
    <path d="M1240 255 H1291" stroke="#C7B9AA" stroke-width="4" stroke-linecap="round"/>
    <path d="M1277 245 L1293 255 L1277 265" fill="none" stroke="#C7B9AA" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

    <g opacity=".72">
      <rect x="1315" y="226" width="150" height="58" rx="29" fill="#EEE8E0" stroke="#CFC4B8" stroke-width="2" stroke-dasharray="6 6"/>
      <text x="1390" y="263" text-anchor="middle" class="toolMuted">下一个…</text>
    </g>
  </g>

  <!-- road -->
  <g filter="url(#shadow)">
    <path d="M120 370 Q800 326 1480 370 L1378 530 Q800 492 222 530 Z" fill="url(#road)"/>
  </g>
  <path d="M190 444 Q800 398 1410 444" fill="none" stroke="#E6D2B8" stroke-width="7" stroke-linecap="round" stroke-dasharray="28 31" opacity=".92"/>

  <!-- walking person, moved away from text -->
  <g transform="translate(1110 315)" filter="url(#softShadow)">
    <circle cx="0" cy="0" r="28" fill="#302D29"/>
    <path d="M-5 31 C-26 57 -22 99 -4 119 L20 96 C9 73 13 51 25 39 Z" fill="url(#accent)"/>
    <path d="M-6 55 L-52 82" fill="none" stroke="#302D29" stroke-width="13" stroke-linecap="round"/>
    <path d="M18 58 L58 76" fill="none" stroke="#302D29" stroke-width="13" stroke-linecap="round"/>
    <path d="M-2 113 L-38 166" fill="none" stroke="#302D29" stroke-width="15" stroke-linecap="round"/>
    <path d="M15 111 L54 150" fill="none" stroke="#302D29" stroke-width="15" stroke-linecap="round"/>
    <path d="M-39 166 L-65 166" fill="none" stroke="#302D29" stroke-width="13" stroke-linecap="round"/>
    <path d="M53 150 L76 150" fill="none" stroke="#302D29" stroke-width="13" stroke-linecap="round"/>
  </g>
  <path d="M1222 395 C1270 376 1320 371 1384 376" fill="none" stroke="#D76B44" stroke-width="5" stroke-linecap="round"/>
  <path d="M1367 364 L1388 376 L1368 389" fill="none" stroke="#D76B44" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- three balanced foundations -->
  <g filter="url(#shadow)">
    <path d="M195 530 L608 508 L608 847 L195 872 Z" fill="#B95B3B"/>
    <path d="M612 508 L988 508 L988 847 L612 847 Z" fill="#9D4933"/>
    <path d="M992 508 L1405 530 L1405 872 L992 847 Z" fill="#743F34"/>
  </g>

  <!-- foundation 1 -->
  <g transform="translate(352 565)">
    <path d="M0 0 H96 V84 H0 Z" fill="none" stroke="#FFF4EA" stroke-width="6" stroke-linejoin="round"/>
    <path d="M48 0 V84" stroke="#FFF4EA" stroke-width="5"/>
    <path d="M12 19 H35 M12 36 H35 M61 19 H84 M61 36 H84" stroke="#FFF4EA" stroke-width="4" stroke-linecap="round" opacity=".86"/>
  </g>
  <text x="400" y="695" text-anchor="middle" class="cn foundation">计算机基础</text>
  <text x="400" y="734" text-anchor="middle" class="cn foundationSmall">网络 · 数据库 · 并发</text>
  <line x1="285" y1="756" x2="515" y2="756" stroke="#E8B49E" stroke-width="2" opacity=".72"/>
  <text x="400" y="792" text-anchor="middle" class="cn foundationSub">工程基本功</text>
  <text x="400" y="827" text-anchor="middle" class="cn foundationSmall">编码 · 调试 · 测试</text>

  <!-- foundation 2 -->
  <g transform="translate(752 611)">
    <circle cx="48" cy="0" r="45" fill="none" stroke="#FFF4EA" stroke-width="6"/>
    <path d="M48 -30 V30 M18 0 H78 M27 -21 L69 21 M69 -21 L27 21" stroke="#FFF4EA" stroke-width="5" stroke-linecap="round" opacity=".9"/>
    <circle cx="48" cy="0" r="13" fill="#FFF4EA"/>
  </g>
  <text x="800" y="713" text-anchor="middle" class="cn foundation">实践经验</text>
  <text x="800" y="763" text-anchor="middle" class="cn foundationSmall">写过代码 · 排过故障</text>
  <text x="800" y="801" text-anchor="middle" class="cn foundationSmall">踩过坑 · 做过复盘</text>

  <!-- foundation 3 -->
  <g transform="translate(1152 550)">
    <path d="M48 0 L96 21 V57 C96 91 76 112 48 126 C20 112 0 91 0 57 V21 Z" fill="none" stroke="#FFF4EA" stroke-width="6" stroke-linejoin="round"/>
    <path d="M25 60 L42 77 L73 42" fill="none" stroke="#FFF4EA" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="1200" y="713" text-anchor="middle" class="cn foundation">独立判断</text>
  <text x="1200" y="763" text-anchor="middle" class="cn foundationSmall">识别错误 · 权衡方案</text>
  <text x="1200" y="801" text-anchor="middle" class="cn foundationSmall">验证结果 · 承担责任</text>
</svg>
