<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="04-stream500-title 04-stream500-desc" id="d-04-stream-500-root">
        <title id="04-stream500-title">流式 500 的错误链</title>
        <desc id="04-stream500-desc">SSE 分片暂存期间后台定时器触发刷新，发送接口返回 nothing to flush，网关误判为客户端断连而停止读取上游，客户端最终收到 500 且没有任何内容。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #d-04-stream-500-root { --color-paper:  #ffffff;
      --color-ink:    #2d2d2d;
      --color-muted:  #686868;
      --color-accent: #c74b1c;
      --font-sans:    'Lato', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      --font-mono:    consolas, Menlo, 'PingFang SC', 'Microsoft YaHei', monospace;
      --font-serif:   Georgia, 'Songti SC', serif; }
      #d-04-stream-500-root { font-family: var(--font-sans); color: var(--color-ink); }
      #d-04-stream-500-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#d-04-stream-500-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="d-04-stream-500-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#686868"/></marker>
          <marker id="d-04-stream-500-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#c74b1c"/></marker>
          <marker id="d-04-stream-500-arrow-open" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polyline points="0 0, 8 3, 0 6" fill="none" stroke="#686868" stroke-width="1.2"/></marker>
        </defs>

        <rect width="100%" height="100%" fill="#ffffff"/>

        <!-- lifelines -->
        <line x1="180" y1="136" x2="180" y2="660" stroke="#2d2d2d" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="560" y1="136" x2="560" y2="660" stroke="#2d2d2d" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="860" y1="136" x2="860" y2="660" stroke="#2d2d2d" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>
        <line x1="1140" y1="136" x2="1140" y2="660" stroke="#2d2d2d" stroke-width="1" stroke-dasharray="3,3" stroke-opacity="0.20"/>

        <!-- msg 1: upstream -> gateway -->
        <line x1="180" y1="210" x2="554" y2="210" stroke="#686868" stroke-width="1.2" marker-end="url(#d-04-stream-500-arrow)"/>
        <rect x="332" y="190" width="76" height="12" rx="2" fill="#ffffff"/>
        <text x="370" y="199" fill="#737373" font-size="8" font-family="consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">分片 1/2 到达</text>

        <!-- msg 2: gateway self -->
        <path d="M 560,280 H 580 Q 588,280 588,288 V 296 Q 588,304 580,304 H 564" fill="none" stroke="#686868" stroke-width="1.2" marker-end="url(#d-04-stream-500-arrow)"/>
        <rect x="598" y="284" width="72" height="12" rx="2" fill="#ffffff"/>
        <text x="634" y="293" fill="#737373" font-size="8" font-family="consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">暂存，等拼齐</text>

        <!-- msg 3: timer -> gateway (async) -->
        <line x1="858" y1="370" x2="566" y2="370" stroke="#686868" stroke-width="1" stroke-dasharray="5,4" marker-end="url(#d-04-stream-500-arrow-open)"/>
        <rect x="672" y="350" width="76" height="12" rx="2" fill="#ffffff"/>
        <text x="710" y="359" fill="#737373" font-size="8" font-family="consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">触发定时刷新</text>

        <!-- msg 4: gateway self -->
        <path d="M 560,440 H 580 Q 588,440 588,448 V 456 Q 588,464 580,464 H 564" fill="none" stroke="#686868" stroke-width="1.2" marker-end="url(#d-04-stream-500-arrow)"/>
        <rect x="598" y="444" width="142" height="12" rx="2" fill="#ffffff"/>
        <text x="669" y="453" fill="#737373" font-size="8" font-family="consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">send()：nothing to flush</text>

        <!-- callout -->
        <text x="700" y="502" fill="#686868" font-size="14" font-family="Georgia, 'Songti SC', serif" font-style="italic" text-anchor="middle">只是暂态，不是断连信号</text>

        <!-- msg 5: gateway -> upstream (accent) -->
        <line x1="558" y1="540" x2="186" y2="540" stroke="#c74b1c" stroke-width="1.4" marker-end="url(#d-04-stream-500-arrow-accent)"/>
        <rect x="315" y="520" width="110" height="12" rx="2" fill="#ffffff"/>
        <text x="370" y="529" fill="#c74b1c" font-size="8" font-family="consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">误判断连 · 停读上游</text>

        <!-- msg 6: gateway -> client -->
        <line x1="562" y1="620" x2="1134" y2="620" stroke="#686868" stroke-width="1.2" marker-end="url(#d-04-stream-500-arrow)"/>
        <rect x="733" y="600" width="94" height="12" rx="2" fill="#ffffff"/>
        <text x="780" y="609" fill="#737373" font-size="8" font-family="consolas, Menlo, monospace" text-anchor="middle" letter-spacing="0.06em">500 · 无任何内容</text>

        <!-- actor boxes -->
        <rect x="60" y="88" width="240" height="48" rx="6" fill="#ffffff"/>
        <rect x="60" y="88" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d2d2d" stroke-width="1" stroke-opacity="0.30"/>
        <text x="180" y="110" fill="#2d2d2d" font-size="12" font-weight="700" font-family="Lato, 'Noto Sans SC', sans-serif" text-anchor="middle">上游 LLM</text>
        <text x="180" y="126" fill="#686868" font-size="9" font-family="consolas, Menlo, monospace" text-anchor="middle">Azure · SSE 流</text>

        <rect x="440" y="88" width="240" height="48" rx="6" fill="#ffffff"/>
        <rect x="440" y="88" width="240" height="48" rx="6" fill="#ffffff" stroke="#2d2d2d" stroke-width="1" stroke-opacity="0.30"/>
        <text x="560" y="110" fill="#2d2d2d" font-size="12" font-weight="700" font-family="Lato, 'Noto Sans SC', sans-serif" text-anchor="middle">网关 SSE 暂存</text>
        <text x="560" y="126" fill="#686868" font-size="9" font-family="consolas, Menlo, monospace" text-anchor="middle">分片拼接 + 刷新逻辑</text>

        <rect x="740" y="88" width="240" height="48" rx="6" fill="#ffffff"/>
        <rect x="740" y="88" width="240" height="48" rx="6" fill="#2d2d2d" stroke="#686868" stroke-width="1" fill-opacity="0.05"/>
        <text x="860" y="110" fill="#2d2d2d" font-size="12" font-weight="700" font-family="Lato, 'Noto Sans SC', sans-serif" text-anchor="middle">后台定时器</text>
        <text x="860" y="126" fill="#686868" font-size="9" font-family="consolas, Menlo, monospace" text-anchor="middle">streaming_flush_interval</text>

        <rect x="1020" y="88" width="240" height="48" rx="6" fill="#ffffff"/>
        <rect x="1020" y="88" width="240" height="48" rx="6" fill="#686868" stroke="#737373" stroke-width="1" fill-opacity="0.10"/>
        <text x="1140" y="110" fill="#2d2d2d" font-size="12" font-weight="700" font-family="Lato, 'Noto Sans SC', sans-serif" text-anchor="middle">客户端</text>
        <text x="1140" y="126" fill="#686868" font-size="9" font-family="consolas, Menlo, monospace" text-anchor="middle">Codex / curl</text>
      </svg>
