<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">一个 Token 如何变成答案</title>
  <desc id="desc">输入文字先被切分为 Token 并转换成向量，经过多层 Transformer 处理后形成下一个 Token 的概率分布。选出的 Token 被追加到上下文，模型重复这一过程，最终逐步生成完整答案。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F4EC"/>
      <stop offset="1" stop-color="#EEF3F7"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E97845"/>
      <stop offset="1" stop-color="#C84D2D"/>
    </linearGradient>
    <linearGradient id="model" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#315C78"/>
      <stop offset="1" stop-color="#203D54"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#263746" flood-opacity="0.11"/>
    </filter>
    <marker id="arrowOrange" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#D45A34" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowSlate" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M1 1 L11 6 L1 11" fill="none" stroke="#607786" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .cn { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
      .title { font-size: 54px; font-weight: 750; fill: #263746; letter-spacing: 1px; }
      .subtitle { font-size: 24px; fill: #6F7D85; }
      .step { font-size: 19px; font-weight: 700; fill: #C84D2D; letter-spacing: 1px; }
      .boxTitle { font-size: 27px; font-weight: 700; fill: #263746; }
      .boxText { font-size: 20px; fill: #6B7780; }
      .token { font-size: 22px; font-weight: 650; fill: #3F4D55; }
      .whiteTitle { font-size: 30px; font-weight: 750; fill: #FFFFFF; }
      .whiteText { font-size: 20px; fill: #DCE8EF; }
      .small { font-size: 18px; fill: #78868E; }
      .supportTitle { font-size: 22px; font-weight: 700; fill: #334957; }
      .supportText { font-size: 18px; fill: #71808A; }
    </style>
  </defs>

  <rect width="1600" height="960" fill="url(#bg)"/>
  <circle cx="110" cy="120" r="72" fill="#F0D7C8" opacity="0.38"/>
  <circle cx="1500" cy="805" r="125" fill="#C9DBE5" opacity="0.36"/>
  <path d="M0 810 C250 735 430 900 690 824 C950 748 1215 846 1600 748 V960 H0 Z" fill="#FFFFFF" opacity="0.42"/>

  <text x="800" y="88" text-anchor="middle" class="cn title">一个 Token 如何变成答案</text>
  <text x="800" y="132" text-anchor="middle" class="cn subtitle">大模型不是一次写完整篇回答，而是在上下文中不断预测下一个 Token</text>

  <!-- Main flow card -->
  <rect x="70" y="182" width="1460" height="502" rx="32" fill="#FFFDF9" stroke="#E7E1D8" filter="url(#shadow)"/>

  <!-- Step 1: input and tokens -->
  <text x="118" y="232" class="cn step">01 文字切成 TOKEN</text>
  <rect x="112" y="260" width="260" height="340" rx="24" fill="#F8EEE7" stroke="#EDC9B9"/>
  <text x="242" y="310" text-anchor="middle" class="cn boxTitle">输入文字</text>
  <rect x="145" y="340" width="194" height="68" rx="15" fill="#FFFFFF" stroke="#E7C2B2"/>
  <text x="242" y="382" text-anchor="middle" class="cn token">解释大模型</text>
  <path d="M242 423 V452" fill="none" stroke="#D45A34" stroke-width="4" marker-end="url(#arrowOrange)"/>
  <g>
    <rect x="137" y="473" width="58" height="52" rx="13" fill="#FFFFFF" stroke="#DFA88F"/>
    <rect x="204" y="473" width="58" height="52" rx="13" fill="#FFFFFF" stroke="#DFA88F"/>
    <rect x="271" y="473" width="68" height="52" rx="13" fill="#FFFFFF" stroke="#DFA88F"/>
    <text x="166" y="506" text-anchor="middle" class="cn token">解释</text>
    <text x="233" y="506" text-anchor="middle" class="cn token">大</text>
    <text x="305" y="506" text-anchor="middle" class="cn token">模型</text>
  </g>
  <text x="242" y="565" text-anchor="middle" class="cn boxText">每个 Token 先变成编号</text>

  <!-- arrow 1 -->
  <path d="M390 430 H438" fill="none" stroke="#607786" stroke-width="4" marker-end="url(#arrowSlate)"/>

  <!-- Step 2: vectors -->
  <text x="448" y="232" class="cn step">02 转换成向量</text>
  <rect x="438" y="260" width="230" height="340" rx="24" fill="#F3F7F9" stroke="#C8D8E1"/>
  <text x="553" y="310" text-anchor="middle" class="cn boxTitle">嵌入表示</text>
  <g transform="translate(478 347)">
    <rect x="0" y="0" width="150" height="156" rx="16" fill="#FFFFFF" stroke="#C4D5DF"/>
    <g fill="#315C78">
      <rect x="22" y="24" width="20" height="20" rx="5" opacity="0.28"/>
      <rect x="52" y="24" width="20" height="20" rx="5" opacity="0.82"/>
      <rect x="82" y="24" width="20" height="20" rx="5" opacity="0.52"/>
      <rect x="112" y="24" width="20" height="20" rx="5" opacity="0.68"/>
      <rect x="22" y="55" width="20" height="20" rx="5" opacity="0.73"/>
      <rect x="52" y="55" width="20" height="20" rx="5" opacity="0.35"/>
      <rect x="82" y="55" width="20" height="20" rx="5" opacity="0.92"/>
      <rect x="112" y="55" width="20" height="20" rx="5" opacity="0.43"/>
      <rect x="22" y="86" width="20" height="20" rx="5" opacity="0.56"/>
      <rect x="52" y="86" width="20" height="20" rx="5" opacity="0.96"/>
      <rect x="82" y="86" width="20" height="20" rx="5" opacity="0.24"/>
      <rect x="112" y="86" width="20" height="20" rx="5" opacity="0.76"/>
      <rect x="22" y="117" width="20" height="20" rx="5" opacity="0.88"/>
      <rect x="52" y="117" width="20" height="20" rx="5" opacity="0.48"/>
      <rect x="82" y="117" width="20" height="20" rx="5" opacity="0.64"/>
      <rect x="112" y="117" width="20" height="20" rx="5" opacity="0.32"/>
    </g>
  </g>
  <text x="553" y="547" text-anchor="middle" class="cn boxText">数字承载词义、位置</text>
  <text x="553" y="576" text-anchor="middle" class="cn boxText">以及后续上下文信息</text>

  <!-- arrow 2 -->
  <path d="M687 430 H735" fill="none" stroke="#607786" stroke-width="4" marker-end="url(#arrowSlate)"/>

  <!-- Step 3: Transformer -->
  <text x="744" y="232" class="cn step">03 多层 TRANSFORMER</text>
  <rect x="730" y="252" width="344" height="366" rx="28" fill="url(#model)"/>
  <text x="902" y="306" text-anchor="middle" class="cn whiteTitle">持续更新 Token 表示</text>
  <g opacity="0.98">
    <rect x="785" y="338" width="234" height="62" rx="14" fill="#FFFFFF" opacity="0.13" stroke="#D8E8F1"/>
    <text x="902" y="378" text-anchor="middle" class="cn whiteText">注意力：整合可见上下文</text>
    <rect x="785" y="418" width="234" height="62" rx="14" fill="#FFFFFF" opacity="0.13" stroke="#D8E8F1"/>
    <text x="902" y="458" text-anchor="middle" class="cn whiteText">前馈网络：加工每个位置</text>
    <rect x="785" y="498" width="234" height="62" rx="14" fill="#FFFFFF" opacity="0.13" stroke="#D8E8F1"/>
    <text x="902" y="538" text-anchor="middle" class="cn whiteText">残差与归一化：稳定传递</text>
  </g>
  <text x="902" y="592" text-anchor="middle" class="cn whiteText">重复 N 层</text>

  <!-- arrow 3 -->
  <path d="M1093 430 H1141" fill="none" stroke="#607786" stroke-width="4" marker-end="url(#arrowSlate)"/>

  <!-- Step 4: probabilities -->
  <text x="1150" y="232" class="cn step">04 预测下一个 TOKEN</text>
  <rect x="1136" y="260" width="344" height="340" rx="24" fill="#F8EEE7" stroke="#EDC9B9"/>
  <text x="1308" y="310" text-anchor="middle" class="cn boxTitle">概率分布</text>
  <g class="cn">
    <text x="1174" y="365" class="token">是</text>
    <rect x="1222" y="345" width="205" height="24" rx="12" fill="#E8D7CE"/>
    <rect x="1222" y="345" width="170" height="24" rx="12" fill="url(#accent)"/>
    <text x="1440" y="365" class="small">62%</text>

    <text x="1174" y="421" class="token">一种</text>
    <rect x="1222" y="401" width="205" height="24" rx="12" fill="#E8D7CE"/>
    <rect x="1222" y="401" width="70" height="24" rx="12" fill="#DCA087"/>
    <text x="1440" y="421" class="small">21%</text>

    <text x="1174" y="477" class="token">通过</text>
    <rect x="1222" y="457" width="205" height="24" rx="12" fill="#E8D7CE"/>
    <rect x="1222" y="457" width="38" height="24" rx="12" fill="#DCA087"/>
    <text x="1440" y="477" class="small">9%</text>
  </g>
  <rect x="1197" y="515" width="222" height="54" rx="16" fill="#FFFFFF" stroke="#DFA88F"/>
  <text x="1308" y="550" text-anchor="middle" class="cn token">选出「是」并追加到上下文</text>

  <!-- autoregressive loop -->
  <path d="M1308 617 V651 H902 V635" fill="none" stroke="#D45A34" stroke-width="4" stroke-dasharray="9 10" marker-end="url(#arrowOrange)"/>
  <rect x="1008" y="625" width="196" height="47" rx="23" fill="#FFF7F2" stroke="#E8B7A3"/>
  <text x="1106" y="656" text-anchor="middle" class="cn" font-size="19" font-weight="700" fill="#C84D2D">追加后，再预测一次</text>

  <!-- Answer strip -->
  <rect x="174" y="718" width="1252" height="88" rx="24" fill="#FFFFFF" stroke="#D6DFE4" filter="url(#shadow)"/>
  <text x="225" y="771" class="cn supportTitle">逐步生成：</text>
  <g class="cn token">
    <rect x="365" y="739" width="68" height="46" rx="12" fill="#F8EEE7"/><text x="399" y="769" text-anchor="middle">大模型</text>
    <text x="451" y="769" fill="#A4AFB5">→</text>
    <rect x="484" y="739" width="54" height="46" rx="12" fill="#F8EEE7"/><text x="511" y="769" text-anchor="middle">是</text>
    <text x="555" y="769" fill="#A4AFB5">→</text>
    <rect x="588" y="739" width="68" height="46" rx="12" fill="#F8EEE7"/><text x="622" y="769" text-anchor="middle">一种</text>
    <text x="673" y="769" fill="#A4AFB5">→</text>
    <rect x="706" y="739" width="68" height="46" rx="12" fill="#F8EEE7"/><text x="740" y="769" text-anchor="middle">通过</text>
    <text x="791" y="769" fill="#A4AFB5">→</text>
    <rect x="824" y="739" width="104" height="46" rx="12" fill="#F8EEE7"/><text x="876" y="769" text-anchor="middle">大量参数</text>
    <text x="945" y="769" fill="#A4AFB5">→</text>
    <rect x="978" y="739" width="118" height="46" rx="12" fill="#F8EEE7"/><text x="1037" y="769" text-anchor="middle">预测文字</text>
    <text x="1113" y="769" fill="#A4AFB5">→</text>
    <rect x="1146" y="739" width="222" height="46" rx="12" fill="url(#accent)"/><text x="1257" y="769" text-anchor="middle" fill="#FFFFFF">……最终组成完整答案</text>
  </g>

  <!-- Supporting concepts -->
  <text x="800" y="854" text-anchor="middle" class="cn small">文章围绕这条主线，继续解释模型为什么能这样工作，以及怎样让它运行得更好</text>
  <g class="cn">
    <rect x="190" y="882" width="270" height="48" rx="24" fill="#E7EFF3"/>
    <text x="325" y="913" text-anchor="middle" class="supportTitle">架构：Transformer · MoE</text>
    <rect x="485" y="882" width="270" height="48" rx="24" fill="#F4E7E0"/>
    <text x="620" y="913" text-anchor="middle" class="supportTitle">训练：预训练 · 后训练</text>
    <rect x="780" y="882" width="310" height="48" rx="24" fill="#E7EFF3"/>
    <text x="935" y="913" text-anchor="middle" class="supportTitle">推理：GPU · KV Cache</text>
    <rect x="1115" y="882" width="294" height="48" rx="24" fill="#F4E7E0"/>
    <text x="1262" y="913" text-anchor="middle" class="supportTitle">应用：RAG · 微调 · 评估</text>
  </g>
</svg>
