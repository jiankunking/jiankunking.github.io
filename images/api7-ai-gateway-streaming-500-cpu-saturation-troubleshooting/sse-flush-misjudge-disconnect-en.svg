<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 736" role="img" aria-labelledby="sse-title sse-desc" font-family="-apple-system, 'Helvetica Neue', 'Arial', sans-serif">
  <title id="sse-title">The error chain behind streaming 500s</title>
  <desc id="sse-desc">One SSE message reaches the gateway in multiple chunks. Incomplete chunks are buffered but still marked as needing a flush. When the background flush timer fires, the send API returns "nothing to flush", which only means there is nothing to send right now. The old logic misread this as a client disconnect and stopped reading from the Azure upstream. The error happens before any response content is emitted, so the client receives nothing and the access log records a 500.</desc>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#4a5a6a"/>
    </marker>
    <marker id="arr-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#d9534f"/>
    </marker>
    <marker id="arr-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2e7d43"/>
    </marker>
  </defs>
  <rect x="0.5" y="0.5" width="879" height="735" rx="8" fill="#ffffff" stroke="#e3e8ec"/>

  <text x="440" y="32" text-anchor="middle" font-size="17" font-weight="700" fill="#2b3a46">Streaming 500s: "nothing to flush" misread as a client disconnect</text>
  <text x="440" y="55" text-anchor="middle" font-size="12" fill="#6b7885">Whether it fires depends on the race between chunk arrival and the timer, not on response length — hence the intermittent behavior</text>

  <!-- lane chips -->
  <rect x="50" y="76" width="120" height="30" rx="15" fill="#f4f8fb" stroke="#9db4cc"/>
  <text x="110" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#2b3a46">Client</text>
  <rect x="240" y="76" width="210" height="30" rx="15" fill="#f4f8fb" stroke="#9db4cc"/>
  <text x="345" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#2b3a46">API7 gateway (streaming path)</text>
  <rect x="490" y="76" width="170" height="30" rx="15" fill="#f4f8fb" stroke="#9db4cc"/>
  <text x="575" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#2b3a46">Background flush timer</text>
  <rect x="706" y="76" width="168" height="30" rx="15" fill="#f4f8fb" stroke="#9db4cc"/>
  <text x="790" y="96" text-anchor="middle" font-size="12" font-weight="700" fill="#2b3a46">Azure (GPT upstream)</text>

  <!-- lifelines -->
  <g stroke="#c7d2dc" stroke-width="1.2" stroke-dasharray="4 4">
    <line x1="110" y1="112" x2="110" y2="600"/>
    <line x1="345" y1="112" x2="345" y2="600"/>
    <line x1="575" y1="112" x2="575" y2="600"/>
    <line x1="790" y1="112" x2="790" y2="600"/>
  </g>

  <!-- 1. client -> gateway -->
  <line x1="110" y1="148" x2="341" y2="148" stroke="#4a5a6a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="225" y="140" text-anchor="middle" font-size="11" fill="#2b3a46">1. stream=true (Codex, curl, app)</text>

  <!-- 2. gateway -> azure -->
  <line x1="345" y1="202" x2="781" y2="202" stroke="#4a5a6a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="563" y="194" text-anchor="middle" font-size="11.5" fill="#2b3a46">2. Forward and read the SSE stream</text>

  <!-- 3. azure -> gateway -->
  <line x1="790" y1="256" x2="354" y2="256" stroke="#4a5a6a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="567" y="248" text-anchor="middle" font-size="11.5" fill="#2b3a46">3. One SSE message arrives in multiple chunks (chunk 1 / 2 ...)</text>

  <!-- 4. gateway self: buffer but mark flush needed -->
  <path d="M345 288 h 62 v 24 h -62" fill="none" stroke="#e8a33d" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="160" y="322" width="560" height="36" rx="8" fill="#fff6e3" stroke="#e8a33d"/>
  <text x="440" y="345" text-anchor="middle" font-size="11.5" fill="#8a5a12">4. Incomplete chunks are buffered, <tspan font-weight="700">but still marked "flush needed"</tspan> (the defect)</text>

  <!-- 5. timer -> gateway -->
  <line x1="575" y1="392" x2="354" y2="392" stroke="#4a5a6a" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="465" y="384" text-anchor="middle" font-size="11.5" fill="#2b3a46">5. Timer triggers a flush</text>

  <!-- 6. gateway self: nothing to flush -->
  <path d="M345 406 h 62 v 24 h -62" fill="none" stroke="#4a5a6a" stroke-width="1.8" marker-end="url(#arr)"/>
  <rect x="130" y="440" width="620" height="36" rx="8" fill="#f4f6f8" stroke="#b9c4cf"/>
  <text x="440" y="463" text-anchor="middle" font-size="11.5" fill="#4a5a6a">6. The send API returns <tspan font-family="Menlo, Consolas, monospace">nothing to flush</tspan> — it only means "nothing to send right now"</text>

  <!-- 7. the misjudgement -->
  <rect x="120" y="502" width="640" height="46" rx="8" fill="#fdeceb" stroke="#d9534f" stroke-width="1.6"/>
  <circle cx="148" cy="525" r="11" fill="#d9534f"/>
  <path d="M143 520 l10 10 M153 520 l-10 10" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round"/>
  <text x="448" y="521" text-anchor="middle" font-size="12" font-weight="700" fill="#b4453a">7. Old logic misjudged: "nothing to flush" = "client disconnected"</text>
  <text x="448" y="539" text-anchor="middle" font-size="11" fill="#b4453a">so it proactively stopped reading from Azure — but the client was still connected</text>
  <text x="440" y="568" text-anchor="middle" font-size="10.5" fill="#8a97a3" font-style="italic">The misdetected disconnect was logged at INFO while production ran WARN: the clue never shows up in logs</text>

  <!-- 8. nothing reaches the client -->
  <line x1="345" y1="592" x2="148" y2="592" stroke="#d9534f" stroke-width="1.8" stroke-dasharray="6 5"/>
  <circle cx="133" cy="592" r="10" fill="#d9534f"/>
  <path d="M128 587 l10 10 M138 587 l-10 10" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round"/>
  <text x="240" y="584" text-anchor="middle" font-size="11" fill="#b4453a">8. No response content sent</text>
  <text x="440" y="616" text-anchor="middle" font-size="12" font-weight="700" fill="#b4453a">Result: the client receives nothing at all, and the access log ends up recording a 500</text>

  <!-- fix panel -->
  <rect x="40" y="632" width="800" height="64" rx="8" fill="#eef8f1" stroke="#58b27a" stroke-width="1.4"/>
  <text x="60" y="654" font-size="12" font-weight="700" fill="#2e7d43">Fix (patch.3)</text>
  <text x="160" y="649" font-size="11.5" fill="#2e7d43">Keep waiting on "nothing to flush"; do not treat it as a disconnect.</text>
  <text x="160" y="665" font-size="11.5" fill="#2e7d43">Schedule the flush only after the downstream response has consumed the content.</text>
  <text x="60" y="681" font-size="12" font-weight="700" fill="#2e7d43">Workaround</text>
  <text x="160" y="681" font-size="11.5" fill="#2e7d43">streaming_flush_interval_ms = 0: disable the background flush timer and switch to synchronous ngx.flush(true)</text>
  <path d="M200 602 v 28" stroke="#58b27a" stroke-width="1.6" stroke-dasharray="4 4" marker-end="url(#arr-green)"/>

  <text x="440" y="718" text-anchor="middle" font-size="10.5" fill="#6b7885">The real interleaving of steps 2 and 3 decides whether this chain is ever hit: when chunks arrive vs. when the timer fires</text>
</svg>
