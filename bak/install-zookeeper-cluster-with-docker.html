<h1 class="post-title" itemprop="name headline">通过Docker部署ZooKeeper集群
</h1>

<div class="post-meta-container">
</div>

</header>

      
      
      
      <div class="post-body">
          <p>容器化部署ZooKeeper集群</p>
<span id="more"></span>

<p>以3.5.7为例</p>
<p>配置文件：</p>
<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br></pre></td><td class="code"><pre><span class="line">tickTime=2000</span><br><span class="line">initLimit=5</span><br><span class="line">syncLimit=2</span><br><span class="line">autopurge.snapRetainCount=3</span><br><span class="line">autopurge.purgeInterval=0</span><br><span class="line">maxClientCnxns=60</span><br><span class="line">admin.enableServer=true</span><br><span class="line">clientPort=2181</span><br></pre></td></tr></table></figure>

<p>docker-compose.yml文件：</p>
<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br><span class="line">2</span><br><span class="line">3</span><br><span class="line">4</span><br><span class="line">5</span><br><span class="line">6</span><br><span class="line">7</span><br><span class="line">8</span><br><span class="line">9</span><br><span class="line">10</span><br><span class="line">11</span><br><span class="line">12</span><br><span class="line">13</span><br><span class="line">14</span><br><span class="line">15</span><br><span class="line">16</span><br><span class="line">17</span><br><span class="line">18</span><br><span class="line">19</span><br></pre></td><td class="code"><pre><span class="line">version: &#x27;3.1&#x27;</span><br><span class="line"></span><br><span class="line">services:</span><br><span class="line">  zookeeper:</span><br><span class="line">    image: zookeeper:3.5.7</span><br><span class="line">    restart: always</span><br><span class="line">    container_name: zk-3</span><br><span class="line">    volumes:</span><br><span class="line">      - /data/zk/data:/data</span><br><span class="line">      - /data/zk/datalog:/datalog</span><br><span class="line">      - /home/zk/zookeeper-3.5.7/conf/zoo.cfg:/apache-zookeeper-3.5.7-bin/conf/zoo.cfg</span><br><span class="line">    environment:</span><br><span class="line">      ZOO_MY_ID: 3</span><br><span class="line">      ZOO_SERVERS: server.1=10.133.204.193:2888:3888;2181 server.2=10.133.204.194:2888:3888;2181 server.3=0.0.0.0:2888:3888;2181</span><br><span class="line">    ports:</span><br><span class="line">      - 2181:2181</span><br><span class="line">      - 2888:2888</span><br><span class="line">      - 3888:3888</span><br><span class="line">      - 8080:8080</span><br></pre></td></tr></table></figure>

<p>查看集群状态，主从信息</p>
<figure class="highlight plaintext"><table><tr><td class="gutter"><pre><span class="line">1</span><br></pre></td><td class="code"><pre><span class="line">docker exec -it zk-3 bash ./bin/zkServer.sh status</span><br></pre></td></tr></table></figure>
