<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>页面未找到 | 衣舞晨风</title>
  <meta name="description" content="抱歉，你访问的页面不存在或已经移动。">
  <style>
    :root { color-scheme: light dark; }
    body {
      box-sizing: border-box;
      display: grid;
      min-height: 100vh;
      margin: 0;
      padding: 32px;
      place-items: center;
      background: #f5f7fb;
      color: #1f2937;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", sans-serif;
    }
    main { max-width: 640px; text-align: center; }
    h1 { margin: 0 0 16px; font-size: clamp(64px, 15vw, 128px); line-height: 1; }
    p { margin: 8px 0; color: #4b5563; font-size: 18px; line-height: 1.8; }
    a { display: inline-block; margin-top: 24px; color: #2563eb; text-decoration: none; }
    a:hover { text-decoration: underline; }
    @media (prefers-color-scheme: dark) {
      body { background: #111827; color: #f9fafb; }
      p { color: #d1d5db; }
      a { color: #93c5fd; }
    }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>如果你来访我，我不在，请和我门外的花坐一会儿。</p>
    <p>这个页面不存在，或许已经换了一个地址。</p>
    <a href="/">返回首页</a>
  </main>
</body>
</html>
